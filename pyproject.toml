[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hack-hydra"
version = "0.1.0"
description = "Deterministic repository graph service for Hack Hydra"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "pathspec>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["service/hydra_graph"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["service"]

