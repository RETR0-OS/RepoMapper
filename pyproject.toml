[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hack-hydra"
version = "0.1.0"
description = "Deterministic repository graph service for Hack Hydra"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.140,<1",
  "mcp>=1.29,<3",
  "pydantic>=2.10,<3",
  "pathspec>=0.12,<1",
  "uvicorn>=0.50,<1",
]

[project.scripts]
hydra-graph = "hydra_graph.__main__:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]
packaging = [
  "cyclonedx-bom>=7,<8",
  "pip-licenses>=5,<6",
  "pyinstaller>=6.16,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["service/hydra_graph"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
