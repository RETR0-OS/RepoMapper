<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Argus is a HydraDB-backed VS Code extension that lets you see your code like your agent does: explore the repository graph, watch what a coding agent retrieved, and review what its edit changed."
    />
    <title>Argus — See your code like your agent</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="canonical" href="https://retr0-os.github.io/RepoMapper/" />

    <!-- Open Graph — link previews on Slack, Discord, LinkedIn, iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Argus" />
    <meta property="og:url" content="https://retr0-os.github.io/RepoMapper/" />
    <meta property="og:title" content="Argus — See your code like your agent" />
    <meta
      property="og:description"
      content="A HydraDB-backed VS Code extension. Explore the repository graph, watch the exact context a coding agent retrieved, and review what its edit changed — grounded in source."
    />
    <meta
      property="og:image"
      content="https://retr0-os.github.io/RepoMapper/og.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Argus landing card: 'See your code like your agent' beside a repository graph."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Argus — See your code like your agent" />
    <meta
      name="twitter:description"
      content="A HydraDB-backed VS Code extension. Explore the repository graph, watch the exact context a coding agent retrieved, and review what its edit changed — grounded in source."
    />
    <meta
      name="twitter:image"
      content="https://retr0-os.github.io/RepoMapper/og.png"
    />
    <meta
      name="twitter:image:alt"
      content="Argus landing card: 'See your code like your agent' beside a repository graph."
    />
    <meta name="theme-color" content="#0b0b0c" />
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
